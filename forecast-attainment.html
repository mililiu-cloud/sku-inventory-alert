<style>
/* Layout: masthead → sticky filters → KPI row (gauge + mini charts) → alerts → [bullet-column chart | takeaways]
   → three region cards → grouped-header drill-down table → methodology (collapsed).
   Dark-first in PLAUD black; light mirrors every token; the toolbar toggle overrides the system setting. */
:root {
  color-scheme: dark;
  --bg:#0B0B0D;
  --surface:#141417;
  --surface-2:#1A1B1F;
  --head:#22232A;
  --band:#17222A;
  --hover:#24252C;
  --line:#26272D;
  --line-2:#383943;
  --ink:#F4F4F6;
  --ink-2:#B8B8C1;
  --ink-3:#83838E;
  --accent:#00D0FF;
  --on-accent:#00222B;
  --under:#EF5B45;
  --ok:#25A98F;
  --over:#7389F5;
  --warn:#E8B04B;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --shadow-s:0 10px 30px rgba(0,0,0,.45);
  --font:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r:14px;
  --r-s:8px;
  --barh:68px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --head:#E9ECF2; --band:#EAF6FA; --hover:#EEF1F6;
    --line:#E3E5EB; --line-2:#CDD1DA; --ink:#111318; --ink-2:#4A4E59; --ink-3:#7B808C;
    --accent:#0086AD; --on-accent:#FFFFFF; --under:#D2412B; --ok:#0F8A73; --over:#4A61D8; --warn:#A86B0C; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --shadow:0 18px 50px rgba(20,24,40,.14); --shadow-s:0 10px 28px rgba(20,24,40,.12);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --head:#E9ECF2; --band:#EAF6FA; --hover:#EEF1F6;
  --line:#E3E5EB; --line-2:#CDD1DA; --ink:#111318; --ink-2:#4A4E59; --ink-3:#7B808C;
  --accent:#0086AD; --on-accent:#FFFFFF; --under:#D2412B; --ok:#0F8A73; --over:#4A61D8; --warn:#A86B0C; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;

}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0B0B0D; --surface:#141417; --surface-2:#1A1B1F; --head:#22232A; --band:#17222A; --hover:#24252C;
  --line:#26272D; --line-2:#383943; --ink:#F4F4F6; --ink-2:#B8B8C1; --ink-3:#83838E;
  --accent:#00D0FF; --on-accent:#00222B; --under:#EF5B45; --ok:#25A98F; --over:#7389F5; --warn:#E8B04B; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-s:0 10px 30px rgba(0,0,0,.45);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; transition:background-color .2s, color .2s; }

.page { max-width:1280px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:30px 72px; }

/* ── masthead ── */
.mast { display:flex; align-items:flex-end; justify-content:space-between; gap:20px 32px; flex-wrap:wrap; padding-bottom:22px; }

/* ── filter bar ── */
.bar { position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }

.ddb .arw { width:7px; height:7px; border-right:1.5px solid var(--ink-3); border-bottom:1.5px solid var(--ink-3); transform:rotate(45deg) translate(-2px,-2px); flex:none; }
.ddb[aria-expanded="true"] .arw { transform:rotate(-135deg) translate(-2px,-2px); }
.ddp { position:absolute; top:calc(100% + 6px); left:0; min-width:100%; width:max-content; max-width:min(340px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line-2); border-radius:12px; z-index:60; box-shadow:var(--shadow); overflow:hidden; }

.opt .bx { width:16px; height:16px; flex:none; border:1.5px solid var(--line-2); border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; line-height:1; color:transparent; }

/* ── status pill ── */

        color:var(--ink); background:color-mix(in srgb, var(--st, var(--ink-3)) 16%, transparent); }

.kpi .mini rect.off { opacity:.25; }
.kpi.k-o { --mc:var(--ink-3); }

.gauge .val { stroke:var(--st, var(--accent)); }

.grid2 { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:14px; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px 18px; min-width:0; }

.tip { position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--line-2); border-radius:10px; padding:9px 12px; font-size:12px; color:var(--ink-2); box-shadow:var(--shadow-s); white-space:nowrap; z-index:5; min-width:160px; }

/* ── table ── */

.tw { display:flex; align-items:center; gap:8px; min-width:0; }

/* ── methodology ── */

    if (wd) wTxt.push('<span class="dn">' + l2tName(wd) + ' ' + sg(wd.d) + '</span>');
    if (wTxt.length) tTxt += pick('「国家 × 渠道」偏差最集中在 ' + wTxt.join(' 和 ') + '。', 'At country × channel level, variance concentrates in ' + wTxt.join(' and ') + '.');
    rows.push([pick('渠道', 'Channel'), tTxt]);
  }
  box.innerHTML = rows.map(function (r) { return '<div class="key"><span class="kt">' + r[0] + '</span><div class="t">' + r[1] + '</div></div>'; }).join('');

  /* 区域卡片，按固定顺序 */
  var cards = [];
  ORDER1.forEach(function (region) {
    var e = byL1.get(region); if (!e) return;
    var subs = l2arr.filter(function (x) { return x.k.indexOf(region + '|') === 0; });
    var up = pickTop(subs, 1), dn = pickTop(subs, -1);
    var pls = Array.from(byL1PL.values()).filter(function (x) { return x.k.indexOf(region + '|') === 0; });
    var pu = pickTop(pls, 1), pd = pickTop(pls, -1);
    var tys = Array.from(byL1Type.values()).filter(function (x) { return x.k.indexOf(region + '|') === 0; }).sort(function (x, y) { return y.a - x.a; });
    var pfs = Array.from(byL1Plat.values()).filter(function (x) { return x.k.indexOf(region + '|') === 0; });
    var fu = pickTop(pfs, 1), fd = pickTop(pfs, -1);
    var offset = up && dn && Math.abs(up.d) > 0 && Math.abs(dn.d) / Math.abs(up.d) > 0.5 && Math.abs(e.d) < Math.abs(up.d) * 0.6;
    var ctext = tys.map(function (x) { return '<span class="kv">' + nm(x) + ' <b>' + rtx(x.r) + '</b></span>'; }).join('<span class="sep">·</span>');
    if (tys.length > 1) {
      var big = tys.slice().sort(function (x, y) { return Math.abs(y.d) - Math.abs(x.d); })[0];
      ctext += '<span>' + pick('偏差主要来自 <b>' + nm(big) + '</b>', 'mainly from <b>' + nm(big) + '</b>') + '</span>';
    }
    var dl = '';
    if (up || dn) dl += '<dt>' + pick('国家', 'Country') + '</dt><dd>' + chipPair(up, dn) + '</dd>';
    if (ctext) dl += '<dt>' + pick('渠道', 'Channel') + '</dt><dd>' + ctext + '</dd>';
    if (fu || fd) dl += '<dt>' + pick('平台', 'Platform') + '</dt><dd>' + chipPair(fu, fd) + '</dd>';
    if (pu || pd) dl += '<dt>' + pick('产品', 'Product') + '</dt><dd>' + chipPair(pu, pd) + '</dd>';
    cards.push('<article class="rc ' + cls(e.r) + '"><div class="rc-top">'
      + '<div class="rch"><h3>' + V(region) + '</h3><span class="rv">' + rtx(e.r) + '</span></div>'
      + attBar(e.r, true)
      + '<div class="rcf"><span>' + pick('预估 ', 'Fcst ') + '<b>' + fmt(e.o) + '</b></span><span>' + pick('实际 ', 'Actual ') + '<b>' + fmt(e.a) + '</b></span>'
      + '<span>' + pick('差异 ', 'Var ') + '<b>' + sg(e.d) + '</b></span></div>'
      + '<p class="rcv">' + pill(e.r, verdict(e.r))
      + (offset ? pick('区内一正一负基本对冲，整体达成率不代表各国真实情况。', 'Gains and shortfalls inside the region largely cancel out.') : '')
      + '</p></div>'
      + (dl ? '<dl class="rcd">' + dl + '</dl>' : '')
      + '</article>');
  });
  reg.innerHTML = cards.join('');

  /* 异常提醒 */
  var alerts = [];
  var noFc = l2arr.filter(function (e) { return e.o === 0 && e.a > 0; });
  if (noFc.length) {
    alerts.push('<div><span class="k">' + pick('预估缺失', 'Missing forecast') + '</span>'
      + noFc.map(function (e) { return pick(nm(e) + ' 实际出货 ' + fmt(e.a) + ' 台，OKR 中无对应预估', nm(e) + ' shipped ' + fmt(e.a) + ' units with no matching OKR line'); }).join(pick('；', '; '))
      + pick('。建议在 OKR 模板中补行。', '. Add the missing rows to the OKR template.') + '</div>');
  }
  var plBad = Array.from(byPL.values()).filter(function (e) { return e.r !== null && (e.r < 60 || e.r > 200); });
  if (plBad.length) {
    alerts.push('<div><span class="k">' + pick('产品线异常', 'Product-line outlier') + '</span>'
      + plBad.map(function (e) { return e.k + ' ' + rtx(e.r) + pick('（' + sg(e.d) + '）', ' (' + sg(e.d) + ')'); }).join(pick('；', '; ')) + pick('。', '.') + '</div>');
  }
  var l2Bad = l2arr.filter(function (e) { return e.r !== null && e.r < 60; });
  if (l2Bad.length) {
    l2Bad.sort(function (x, y) { return x.r - y.r; });
    alerts.push('<div><span class="k">' + pick('区域重点', 'Regions to review') + '</span>'
      + l2Bad.slice(0, 4).map(function (e) { return pick(nm(e) + ' 仅 ' + rtx(e.r) + '（' + sg(e.d) + ' 台）', nm(e) + ' at just ' + rtx(e.r) + ' (' + sg(e.d) + ' units)'); }).join(pick('；', '; '))
      + pick('，需要单独复盘。', '; each needs its own review.') + '</div>');
  }
  al.innerHTML = alerts.join('');
  al.hidden = !alerts.length;
}
