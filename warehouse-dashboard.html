<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Warehouse Inventory Dashboard 仓储数据看板</title>
<!-- ExcelJS, not SheetJS: the SheetJS community build silently DISCARDS cell styles on
     write (styling is a Pro feature), so centred/bold/filled cells were impossible.
     ExcelJS writes styles, merges and freeze panes for real. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root {
    --navy: #0f1e3d; --navy2: #16294f; --sidebar-w: 220px;
    --blue: #2563eb; --blue-light: #eef3ff;
    --bg: #f4f6fa; --card: #ffffff; --border: #e6e9f0;
    --text: #1a2233; --muted: #6b7280; --muted-light: #9aa3b2;
    --red: #dc2626; --red-bg: #fdeaea;
    --green: #16a34a; --green-bg: #eaf7ee;
    --grey-bg: #f1f2f5;
    --amber: #b45309; --amber-bg: #fdf3e0;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
         background: var(--bg); color: var(--text); font-size: 13px; }
  a { color: inherit; }

  #app { display:flex; min-height:100vh; }
  #sidebar { width: var(--sidebar-w); flex-shrink:0; background: linear-gradient(180deg,var(--navy),var(--navy2));
             color:#cfd8ee; padding: 20px 0;
             align-self: flex-start; min-height: 100vh; }
  #sidebar .brand { padding: 0 20px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 14px; }
  #sidebar .brand .logo { width:34px; height:34px; border-radius:8px; background: var(--blue);
             display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; margin-bottom:10px; }
  #sidebar .brand .name { font-size:14px; font-weight:700; color:#fff; line-height:1.4; }
  #sidebar .brand .sub { font-size:11px; color:#8fa0c7; margin-top:2px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding: 10px 20px; margin: 2px 10px; border-radius:8px;
              cursor:pointer; font-size:13px; font-weight:500; color:#b6c2e0; }
  .nav-item .dot { width:6px; height:6px; border-radius:50%; background: #5b6c94; flex-shrink:0; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active { background: var(--blue); color:#fff; }
  .nav-item.active .dot { background:#fff; }
  #sidebar .nav-section { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#5b6c94;
              padding: 16px 20px 6px 20px; font-weight:700; }

  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar { background:var(--card); border-bottom:1px solid var(--border); padding: 16px 28px;
            display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  #topbar h1 { margin:0; font-size:18px; font-weight:700; color: var(--text); }
  #topbar .sub { color: var(--muted); font-size:12px; margin-top:3px; }
  #langToggle { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
  #langToggle button { border:none; background:#fff; color:var(--muted); padding:7px 14px; font-size:12px;
            font-weight:700; cursor:pointer; }
  #langToggle button.active { background: var(--blue); color:#fff; }

  .kpis { display:flex; gap:14px; padding: 18px 28px 0 28px; flex-wrap:wrap; }
  .kpi-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px;
              box-shadow: var(--shadow); min-width:150px; flex:1; }
  .kpi-card .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:600; }
  .kpi-card .value { font-size:24px; font-weight:700; margin-top:4px; }
  .kpi-card.alert .value { color: var(--red); }
  .kpi-card.normal .value { color: var(--green); }
  .kpi-card.na .value { color: var(--muted-light); }
  .kpi-card.total .value { color: var(--blue); }

  .meeting-section { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  .meeting-section:last-child { border-bottom: none; }
  .meeting-section-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
  .meeting-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .meeting-section-head .meeting-section-title { margin-bottom: 0; }
  .meeting-section-head select { background: #fff; border: 1px solid var(--border); color: var(--text);
              padding: 6px 12px; border-radius: 8px; font-size: 12.5px; outline: none; }
  .meeting-section-head select:focus { border-color: var(--blue); }
  .meeting-section-filters { display: flex; align-items: center; gap: 10px; }

  .region-bar-row { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
  .region-bar-label { width: 190px; flex-shrink: 0; font-size: 12.5px; font-weight: 700; color: var(--text); }
  .region-bar-track { flex: 1; height: 22px; border-radius: 6px; overflow: hidden; display: flex;
              background: var(--grey-bg); }
  .region-bar-seg { height: 100%; }
  .region-bar-seg.alert { background: var(--red); }
  .region-bar-seg.normal { background: var(--green); }
  .region-bar-seg.na { background: var(--muted-light); }
  .region-bar-seg.norestock { background: var(--amber); }
  .region-bar-counts { width: 210px; flex-shrink: 0; font-size: 12px; color: var(--muted); text-align: right; }

  .risk-region { margin-bottom: 20px; }
  .risk-region:last-child { margin-bottom: 0; }
  .risk-region-title { font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 8px;
              padding-left: 10px; border-left: 3px solid var(--blue); }
  .risk-empty { color: var(--muted); font-size: 12.5px; padding: 10px 0 10px 13px; }
  table.risk-table { width: 100%; min-width: 0; }
  table.risk-table th { background: #f7f8fb; }

  .panel-card { background: var(--card); margin: 18px 28px 28px 28px; border:1px solid var(--border);
                border-radius: 12px; box-shadow: var(--shadow); overflow:hidden; }
  .panel-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding: 14px 18px;
                border-bottom:1px solid var(--border); background: #fafbfd; }
  .panel-toolbar input, .panel-toolbar select { background: #fff; border:1px solid var(--border); color: var(--text);
         padding:7px 12px; border-radius:8px; font-size:12.5px; outline:none; }
  .panel-toolbar input[type=text] { width: 260px; }
  .panel-toolbar input:focus, .panel-toolbar select:focus { border-color: var(--blue); }

  /* ---- multi-select checkbox dropdown (used for Warehouse filters) ---- */
  .ms-select { position: relative; display: inline-block; }
  .ms-select-btn { background:#fff; border:1px solid var(--border); color: var(--text);
              padding:7px 28px 7px 12px; border-radius:8px; font-size:12.5px; outline:none;
              cursor:pointer; min-width:150px; max-width:220px; text-align:left; position:relative;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ms-select-btn::after { content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%);
              font-size:9px; color: var(--muted); }
  .ms-select-btn:hover { border-color: var(--blue); }
  .ms-select.open .ms-select-btn { border-color: var(--blue); }
  .ms-select-panel { display:none; position:absolute; top:calc(100% + 4px); left:0; z-index:50;
              background:#fff; border:1px solid var(--border); border-radius:8px;
              box-shadow:0 8px 24px rgba(0,0,0,.14); min-width:220px; max-width:320px; padding:8px; }
  .ms-select.open .ms-select-panel { display:block; }
  .ms-select-actions { display:flex; gap:10px; padding-bottom:6px; margin-bottom:6px;
              border-bottom:1px solid var(--border); }
  .ms-all-btn, .ms-clear-btn { background:none; border:none; color: var(--blue); font-size:12px;
              cursor:pointer; padding:2px 2px; }
  .ms-all-btn:hover, .ms-clear-btn:hover { text-decoration: underline; }
  .ms-select-options { max-height:240px; overflow-y:auto; display:flex; flex-direction:column; gap:1px; }
  .ms-opt { display:flex; align-items:center; gap:7px; font-size:12.5px; color: var(--text);
              padding:5px 6px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .ms-opt:hover { background: var(--grey-bg); }
  .ms-opt input[type=checkbox] { margin:0; cursor:pointer; flex-shrink:0; }
  .count-label { color: var(--muted); font-size:12px; margin-left:auto; }
  .btn-export { display:flex; align-items:center; gap:6px; background: #fff; border:1px solid var(--border);
        color: var(--text); padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .btn-export:hover { border-color: var(--green); color: var(--green); }
  .btn-export svg { width:14px; height:14px; flex-shrink:0; }

  .table-wrap { overflow: auto; max-height: 68vh; }
  table { border-collapse: collapse; width: max-content; min-width:100%; font-size: 12px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align:center; white-space:nowrap; }
  thead th { position: sticky; top:0; background: #f7f8fb; color:#374151; z-index:3; font-weight:700;
             font-size:11px; text-transform:uppercase; letter-spacing:0.02em; border-bottom:1px solid var(--border); }
  td.name-cell, th.name-cell { text-align:center; white-space:nowrap; }
  tbody tr { transition: background 0.1s; }
  tbody tr:nth-child(even) { background: #fbfcfe; }
  tbody tr:hover { background: var(--blue-light); }

  .grey { color: var(--muted-light); }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
  .badge-alert { background: var(--red-bg); color: var(--red); }
  .badge-normal { background: var(--green-bg); color: var(--green); }
  .badge-na { background: var(--grey-bg); color: var(--muted); }
  /* 不补货清尾: amber rather than grey, so it reads as "deliberately parked" instead of
     being confused with – N/A 无数据 (which means "no sales rate to judge by"). */
  .badge-norestock { background: var(--amber-bg); color: var(--amber); }
  .flag { background: var(--amber-bg) !important; color: var(--amber); font-weight:700; border-radius:6px; }

  #wideTable th.sticky, #wideTable td.sticky,
  #vertTable th.sticky, #vertTable td.sticky,
  .risk-table th.sticky, .risk-table td.sticky { position: sticky; background: #fff; z-index:2; }
  #wideTable thead th.sticky, #vertTable thead th.sticky, .risk-table thead th.sticky { z-index:4; background:#f7f8fb; }
  #wideTable tbody tr:nth-child(even) td.sticky, #vertTable tbody tr:nth-child(even) td.sticky,
  .risk-table tbody tr:nth-child(even) td.sticky { background:#fbfcfe; }
  #wideTable tbody tr:hover td.sticky, #vertTable tbody tr:hover td.sticky,
  .risk-table tbody tr:hover td.sticky { background: var(--blue-light); }
  #vertTable td.sticky, #vertTable th.sticky,
  .risk-table td.sticky, .risk-table th.sticky { box-shadow: 2px 0 4px rgba(16,24,40,0.04); }
  #wideTable .sk0 { font-weight:700; }
  .wh-band { background:#1f3a8a; color:#fff; font-weight:800; letter-spacing:.04em;
            border-right:2px solid #fff; text-align:center; }
  .wh-group-a { background:#eef3ff; color:#1d4ed8; }
  .wh-group-b { background:#f3eefe; color:#7c3aed; }

  /* ---- 横版 template layout: day-cover colouring + subtotal / grand-total rows ---- */
  /* 红 < 14 天, 黄 14-30 天 (per Mili's template). Applied per cell on its own value, so a
     SKU that is empty today but covered by an inbound shipment still reads red on the
     仅可用 column and amber/green on the 含在途 column, instead of both taking the same colour. */
  #wideTable td.d-red   { background: var(--red-bg);   color: var(--red);   font-weight:700; }
  #wideTable td.d-amber { background: var(--amber-bg); color: var(--amber); font-weight:700; }
  /* a daily average that was substituted from the 30-day figure because the forecast sheet
     has no weekly value for this SKU -- dotted underline, explained in the footnotes */
  #wideTable td.avg-fb { border-bottom: 1px dotted var(--amber); }
  #wideTable tr.grp-head td { background:#eef2f7; font-weight:700; color:#1f2937;
                              border-top:2px solid #cbd5e1; }
  #wideTable tr.subtotal td { background:#f1f5f9; font-weight:700; }
  #wideTable tr.subtotal td.sticky { background:#f1f5f9; }
  #wideTable tr.grand td { background:#e2e8f0; font-weight:800; border-top:2px solid #94a3b8; }
  #wideTable tr.grand td.sticky { background:#e2e8f0; }

  .footnotes { margin: 0 28px 28px 28px; padding: 16px 20px; background: var(--card); border:1px solid var(--border);
               border-radius:12px; color: var(--muted); font-size: 11.5px; line-height:1.8; box-shadow: var(--shadow); }
  .footnotes b { color: var(--text); }
  .footnotes .ft-title { font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:8px; }

  .iti-link { color: var(--blue); text-decoration: underline dotted; cursor:pointer; font-weight:600; }
  .iti-link:hover { color:#1d4ed8; }

  #itiModalOverlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,0.45); z-index:50;
              align-items:center; justify-content:center; }
  #itiModalOverlay.show { display:flex; }
  #itiModal { background:#fff; border-radius:14px; width: min(720px, 92vw); max-height:80vh; overflow:hidden;
              display:flex; flex-direction:column; box-shadow: 0 20px 50px rgba(16,24,40,0.25); }
  #itiModal .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
              padding: 18px 22px; border-bottom:1px solid var(--border); }
  #itiModal .modal-head .title { font-size:15px; font-weight:700; color:var(--text); }
  #itiModal .modal-head .sub { font-size:12px; color:var(--muted); margin-top:4px; }
  #itiModal .modal-close { border:none; background:none; font-size:20px; line-height:1; color:var(--muted);
              cursor:pointer; padding:2px 6px; border-radius:6px; }
  #itiModal .modal-close:hover { background: var(--grey-bg); color:var(--text); }
  #itiModal .modal-body { overflow:auto; padding: 4px 0 18px 0; }
  #itiModal table { width:100%; font-size:12px; }
  #itiModal .modal-empty { padding: 28px 22px; color: var(--muted); font-size:12.5px; line-height:1.7; }
</style>
<style id="wideColStyle"></style>
</head>
<body><!-- wd-login-gate -->
<style>
  body.wd-locked > *:not(#wd-login) { display: none !important; }
  #wd-login { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center;
    justify-content: center; background: #f4f6fa; font-family: -apple-system, "PingFang SC",
    "Microsoft YaHei", sans-serif; }
  #wd-login .box { background: #fff; padding: 32px 36px; border-radius: 12px; width: 340px;
    box-shadow: 0 6px 30px rgba(20, 30, 60, .12); }
  #wd-login h2 { margin: 0 0 6px; font-size: 20px; color: #1f2a44; }
  #wd-login p { margin: 0 0 18px; font-size: 13px; color: #6b7280; }
  #wd-login input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px;
    border: 1px solid #cfd6e4; border-radius: 8px; outline: none; }
  #wd-login input:focus { border-color: #3b6ff5; }
  #wd-login button { margin-top: 14px; width: 100%; padding: 10px; font-size: 14px; color: #fff;
    background: #3b6ff5; border: 0; border-radius: 8px; cursor: pointer; }
  #wd-login .err { color: #d93025; font-size: 13px; min-height: 18px; margin-top: 10px; }
  #wd-logout { position: fixed; right: 14px; bottom: 12px; z-index: 9999; font-size: 12px;
    color: #6b7280; background: #fff; border: 1px solid #d9dee8; border-radius: 6px;
    padding: 4px 10px; cursor: pointer; }
</style>
<div id="wd-login" style="display:none">
  <form class="box" onsubmit="return wdLogin(event)">
    <h2>仓储数据看板</h2>
    <p>请输入已授权的公司邮箱登录</p>
    <input id="wd-email" type="email" placeholder="name@plaud.ai" autocomplete="email" required>
    <button type="submit">登录</button>
    <div class="err" id="wd-err"></div>
  </form>
</div>
<script>
(function () {
  var ALLOWED = ["c8840b3bcf82237d4668fd3d6469ed81ae4680a2dbcda825b430f69ae592cccb", "957d9b48a9ef133a3145e0e6a23c50eac7714ee430c3f679ed4d7d9d11d2870f", "7b7a1e3732a50f4fdb3c755630cc21ff734dff8d5c8adf143fd16405e9e84a8b", "83a2f759bfcc1bf4c504296beea1fa29900a61ef2a57eff314de8018f7a1a0c9", "f822f4b54b90eeb1a331df81734bd26d5255327cea82952f9b157a7fa5375531", "2937a93afe6d1f7b0e95a64f48c72e2e71da6767143202be2ff504b2be4e4f78", "9f8bab02c9ebff6b681c7481aa14634bfc081993d095a6466c12dbb31d65ead7", "ebd4fc3443fafcc1aa32d1ecb0de93d5b6860a9c1660904e34640bb6a14f1aaa", "e43fc6c91e62e8e940dd1c9e94c077a404838380b50d45781f60b43b0de1863a", "7b436694de92c381f6ce1688c2a8d178d2f4df25dcf2555d549293a30686fac9", "ea555462b2033c6f349d667009171232d6761ed8e25f0cd963638e14c5cb4253", "92c50076697e58c2b2fbb8ba7245f64c5133de94105914abed0b7c9e58c02e43", "91ed2f18225fc6fa4292500e9474d65f6104a567d501344af8e77a532fcde091", "17ec412c0f9a3c99730a6ec83b8b1a84e69ebd00444e41472e9314a688af79c5", "b86c14d69865d50ef8aa242b23740427f113c0e9ca8cbf992ac396e8e1d27cba", "934c3cbe47e27072ee6ca627efd6166cdc4c4e98e70d6e27680ce3ec9f8cc135", "4497cbfce38527d91b797a6598128da35105f3dfc1788c76681d3cf04ab217c2"], SALT = "plaud-warehouse-dashboard:", KEY = "wd-login:" + "99906d47d237";
  async function h(e) {
    var buf = await crypto.subtle.digest("SHA-256",
      new TextEncoder().encode(SALT + e.trim().toLowerCase()));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  function unlock() {
    document.body.classList.remove("wd-locked");
    document.getElementById("wd-login").style.display = "none";
    if (!document.getElementById("wd-logout")) {
      var b = document.createElement("button");
      b.id = "wd-logout"; b.textContent = "退出";
      b.onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
      document.body.appendChild(b);
    }
  }
  window.wdLogin = async function (ev) {
    ev.preventDefault();
    var v = await h(document.getElementById("wd-email").value);
    if (ALLOWED.indexOf(v) >= 0) {
      try { localStorage.setItem(KEY, v); } catch (e) {}
      unlock();
    } else {
      document.getElementById("wd-err").textContent = "该邮箱无权访问，请联系 Mili 开通";
    }
    return false;
  };
  document.body.classList.add("wd-locked");
  document.getElementById("wd-login").style.display = "flex";
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && ALLOWED.indexOf(saved) >= 0) unlock();
})();
</script>

  <div id="sidebar">
    <div class="brand">
      <div class="logo">P</div>
      <div class="name" data-i18n="brandName">PLAUD 供应链</div>
      <div class="sub" data-i18n="brandSub">仓储库存系统</div>
    </div>
    <div class="nav-section" data-i18n="navSection">仪表盘</div>
    <div class="nav-item active" data-tab="vertical"><span class="dot"></span><span data-i18n="navVertical">库存明细 · 竖版</span></div>
    <div class="nav-item" data-tab="horizontal"><span class="dot"></span><span data-i18n="navHorizontal">SKU透视 · 横版</span></div>

  <div id="main">
    <div id="topbar">
      <div>
        <h1 data-i18n="pageTitle">Warehouse Inventory Dashboard</h1>
        <div class="sub"><span data-i18n="asOf">数据截至 2026-10-15</span> &nbsp;&middot;&nbsp;
          <span data-i18n="rowsLabel">System+Warehouse+SKU 明细</span> <span id="statGroups">530</span> <span data-i18n="rowsUnit">行</span>
          &nbsp;&middot;&nbsp; <span data-i18n="easkuLabel">易仓SKU</span> <span id="statEasku">94</span>
          <span data-i18n="timesUnit">个</span> &times; <span data-i18n="whLabel">仓库</span> <span id="statWh">18</span> <span data-i18n="countUnit">个</span></div>
      </div>
      <div id="langToggle">
        <button id="btnZh" class="active">中文</button>
        <button id="btnEn">EN</button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi-card total"><div class="label" data-i18n="kpiTotal">Total Rows</div><div class="value">530</div></div>

let LANG = 'zh';

function cellClass(v){
  if (v === '--' || v === '-' || v === '' || v === null) return 'grey';
  return '';
}
function alertBadgeHtml(val){
  const s = String(val);
  if (s.indexOf('NoRestock') >= 0) return '<span class="badge badge-norestock">' + I18N[LANG].badgeNoRestock + '</span>';
  if (s.indexOf('ALERT') >= 0) return '<span class="badge badge-alert">ALERT</span>';
  if (s.indexOf('Normal') >= 0) return '<span class="badge badge-normal">Normal</span>';
  if (s.indexOf('N/A') >= 0) return '<span class="badge badge-na">N/A</span>';
  return null;
}
function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(v){
  return esc(v).replace(/"/g,'&quot;');
}

// ---------------- Generic multi-select checkbox dropdown (Warehouse filters) ----------------
// Replaces a plain <select> with a button + checkbox panel so a filter can have either one or
// several values checked at once (per Mili's request); other single-value filters (System,
// Stock Alert, Region) stay as native <select>, this is only used for Warehouse.
const multiSelectState = {};  // id -> Set of currently-checked values
function initMultiSelect(id){
  const root = document.getElementById(id);
  root.classList.add('ms-select');
  root.innerHTML = `<button type="button" class="ms-select-btn"></button>
    <div class="ms-select-panel">
      <div class="ms-select-actions">
        <button type="button" class="ms-all-btn" data-i18n="msSelectAll">全选</button>
        <button type="button" class="ms-clear-btn" data-i18n="msClear">清空</button>
      </div>
      <div class="ms-select-options"></div>
    </div>`;
  multiSelectState[id] = new Set();
  root.querySelector('.ms-select-btn').addEventListener('click', (e)=>{
    e.stopPropagation();
    const willOpen = !root.classList.contains('open');
    document.querySelectorAll('.ms-select.open').forEach(el=>{ if (el !== root) el.classList.remove('open'); });
    root.classList.toggle('open', willOpen);
  });
  root.querySelector('.ms-select-panel').addEventListener('click', (e)=>e.stopPropagation());
  root.querySelector('.ms-all-btn').addEventListener('click', ()=>{
    root.querySelectorAll('.ms-select-options input[type=checkbox]').forEach(cb=>{
      cb.checked = true; multiSelectState[id].add(cb.value);
    });
    updateMultiSelectLabel(id);
    root.dispatchEvent(new Event('ms-change'));
  });
  root.querySelector('.ms-clear-btn').addEventListener('click', ()=>{
    root.querySelectorAll('.ms-select-options input[type=checkbox]').forEach(cb=>{ cb.checked = false; });
    multiSelectState[id].clear();
    updateMultiSelectLabel(id);
    root.dispatchEvent(new Event('ms-change'));
  });
}
document.addEventListener('click', ()=>{
  document.querySelectorAll('.ms-select.open').forEach(el=>el.classList.remove('open'));
});
function populateMultiSelectOptions(id, options, allLabelKey){
  const root = document.getElementById(id);
  root.dataset.allLabelKey = allLabelKey;
  const optWrap = root.querySelector('.ms-select-options');
  const prev = multiSelectState[id] || new Set();
  const validSet = new Set(options);
  const keep = new Set([...prev].filter(v=>validSet.has(v)));
  multiSelectState[id] = keep;
  optWrap.innerHTML = options.map(o=>
    `<label class="ms-opt"><input type="checkbox" value="${escAttr(o)}"${keep.has(o)?' checked':''}><span>${esc(o)}</span></label>`
  ).join('');
  optWrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if (cb.checked) multiSelectState[id].add(cb.value); else multiSelectState[id].delete(cb.value);
      updateMultiSelectLabel(id);
      root.dispatchEvent(new Event('ms-change'));
    });
  });
  updateMultiSelectLabel(id);
}
function updateMultiSelectLabel(id){
  const root = document.getElementById(id);
  const btn = root.querySelector('.ms-select-btn');
  const sel = multiSelectState[id] || new Set();
  const t = I18N[LANG];
  const allLabelKey = root.dataset.allLabelKey;
  if (!sel.size) btn.textContent = t[allLabelKey];
  else if (sel.size === 1) btn.textContent = [...sel][0];
  else btn.textContent = t.msSelectedCount(sel.size);
}
function getMultiSelectValues(id){
  return multiSelectState[id] ? [...multiSelectState[id]] : [];
}
function debounce(fn, ms){
  let timer = null;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(()=>fn.apply(this,args), ms);
  };
}
function alertCode(val){
  const s = String(val);
  // checked first: a no-restock tail must never be counted as an ALERT anywhere (region bars,
  // 本周优先处理清单, the ALERT KPI) -- that is the whole point of the downgrade.
  if (s.indexOf('NoRestock') >= 0) return 'NoRestock';
  if (s.indexOf('ALERT') >= 0) return 'ALERT';
  if (s.indexOf('Normal') >= 0) return 'Normal';
  return 'N/A';
}

// PERFORMANCE NOTE: both tables are built ONCE (renderVerticalBody/renderWideBody below) and
// never torn down/rebuilt again -- the underlying cell values (SKU codes, numbers, System names)
// don't change with language, only the header labels do. Filtering and language switching then
// only toggle `display` on existing <tr> elements / a tiny injected <style> block, instead of
// re-creating thousands of DOM nodes on every keystroke -- this is what actually fixes the
// "顿一下" stutter, since destroy+recreate of a large table is the expensive part, not the filter
// logic itself.
const N_STICKY_V = 5;
function renderVerticalHead(){
  const t = I18N[LANG];
  const thead = document.querySelector('#vertTable thead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  t.vHeaders.forEach((h,i)=>{
    const th=document.createElement('th'); th.textContent=h;
    if (i < N_STICKY_V) th.className = 'sticky sv'+i;
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

let vertTrList = [];   // <tr> elements, built once, index-aligned with DATA.vrows
let vRowMeta = [];     // precomputed {sys, alertCode, hay} per row, for fast filtering
function renderVerticalBody(){
  const tbody = document.querySelector('#vertTable tbody');
  const html = [];
  DATA.vrows.forEach(r=>{
    html.push('<tr>');
    r.forEach((v,i)=>{
      let val = v === null ? '' : v;
      const cls = [];
      if (i===4) cls.push('name-cell');
      if (i < N_STICKY_V) cls.push('sticky sv'+i);
      const cc = cellClass(val);
      if (cc) cls.push(cc);
      let inner;
      if (i===18){ const b = alertBadgeHtml(val); inner = b || esc(val); }
      else if (i===13 && typeof val === 'number' && val > 0){
        const key = [r[0], r[1], r[3]].join('|');
        inner = `<span class="iti-link" data-key="${esc(key)}" data-sys="${esc(r[0])}" data-wh="${esc(r[1])}" data-sku="${esc(r[3])}" data-total="${val}">${val}</span>`;
      } else {
        inner = esc(val);
      }
      html.push(`<td${cls.length ? ` class="${cls.join(' ')}"` : ''}>${inner}</td>`);
    });
    html.push('</tr>');
  });
  tbody.innerHTML = html.join('');
  vertTrList = Array.from(tbody.children);
  vRowMeta = DATA.vrows.map(r=>({
    sys: r[0],
    wh: r[1],
    alertCode: alertCode(r[18]),
    hay: (r[0]+' '+r[1]+' '+r[3]+' '+r[4]).toLowerCase(),
  }));
}

// measure rendered column widths and pin sticky columns' `left` offset accordingly, since
// content width varies by language/data and can't be hardcoded in CSS
function applyStickyOffsets(tableId, nCols, prefix){
  const table = document.getElementById(tableId);
  const thead = table.querySelector('thead');
  if (!thead) return;
  // the wide table has a 3-row header and its sticky cells sit in the first row with
  // rowSpan=3, so look them up across the whole thead instead of one specific <tr>
  const widths = [];
  for (let i = 0; i < nCols; i++){
    const th = thead.querySelector('.'+prefix+i);
    widths.push(th ? th.getBoundingClientRect().width : 0);
  }
  let left = 0;
  for (let i = 0; i < nCols; i++){
    table.querySelectorAll('.'+prefix+i).forEach(cell=>{ cell.style.left = left + 'px'; });
    left += widths[i];
  }
}

let vFiltered = DATA.vrows;
function applyVerticalFilters(){
  const q = document.getElementById('vSearch').value.trim().toLowerCase();
  const sys = document.getElementById('vSystem').value;
  const whSet = new Set(getMultiSelectValues('vWarehouse'));
  const alert = document.getElementById('vAlert').value;
  let shown = 0;
  vFiltered = [];
  vertTrList.forEach((tr, idx)=>{
    const meta = vRowMeta[idx];
    let ok = true;
    if (sys && meta.sys !== sys) ok = false;
    if (ok && whSet.size && !whSet.has(meta.wh)) ok = false;
    if (ok && alert && meta.alertCode !== alert) ok = false;
    if (ok && q && meta.hay.indexOf(q) < 0) ok = false;
    tr.style.display = ok ? '' : 'none';
    if (ok){ shown++; vFiltered.push(DATA.vrows[idx]); }
  });
  applyStickyOffsets('vertTable', N_STICKY_V, 'sv');
  document.getElementById('vCount').textContent = I18N[LANG].vCount(shown, DATA.vrows.length);
}

function populateVerticalSelects(){
  const t = I18N[LANG];
  const sysSel = document.getElementById('vSystem');
  const curSys = sysSel.value;
  sysSel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value=''; o0.textContent = t.vSystemAll; sysSel.appendChild(o0);
  const systems = [...new Set(DATA.vrows.map(r=>r[0]))];
  systems.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sysSel.appendChild(o); });
  sysSel.value = systems.includes(curSys) ? curSys : '';

  const selSys = sysSel.value;
  const warehouses = [...new Set(DATA.vrows.filter(r=>!selSys || r[0]===selSys).map(r=>r[1]))];
  populateMultiSelectOptions('vWarehouse', warehouses, 'vWarehouseAll');

  t.vAlertOpts.forEach(([val,label])=>{ const o=document.createElement('option'); o.value=val; o.textContent=label; alertSel.appendChild(o); });
  alertSel.value = curAlert;
}

// ============================================================================
// 横版 (wide) view -- rebuilt 2026-09-20 to the template layout Mili supplied:
//   Master Category / Sub Category / 产品名称 / 易仓SKU  ||  warehouse x 6 metrics
// grouped by Master Category with 小计 rows and a 总计 row, warehouses switchable
// by region (default US = the four template warehouses first). All of the shape and
// all of the arithmetic comes precomputed from DATA.hgrid (warehouse_dashboard_hgrid.py);
// this layer only renders and filters.
// ============================================================================
const HG = DATA.hgrid;

// which warehouse-column indices (into HG.wh_meta) are visible: the selected region,
// optionally narrowed further by the warehouse multi-select
function getVisibleWhIndices(){
  const regionKey = document.getElementById('hRegion').value;
  const region = HG.regions.find(r=>r.key === regionKey) || HG.regions[HG.regions.length-1];
  const whSet = new Set(getMultiSelectValues('hWarehouse'));
  return region.idx.filter(i => !whSet.size || whSet.has(HG.wh_meta[i][1]));
}

// render a number the way the template does: '-' for no record, ∞ for stock with no demand
function hFmt(v, isDay){
  if (v === null || v === undefined) return '-';
  if (v === 'inf') return '∞';
  if (typeof v !== 'number') return esc(v);
  if (isDay) return v.toFixed(1);
  return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, {maximumFractionDigits:2});
}

// 红 < 14 天, 黄 14-30 天; ∞ and '-' are never coloured.
// `avg` is the cell's own 周度日均: with no daily rate the day count is a meaningless 0.0
// (empty warehouse, no sales) and must NOT be painted red -- that was 55 false alarms out of
// 487 populated cells. A real stockout has demand > 0 and stock 0, and still goes red.
function dayClass(v, avg){
  if (typeof v !== 'number') return '';
  if (avg === null || avg === undefined || avg <= 0) return '';
  if (v < HG.thresholds.red) return 'd-red';
  if (v < HG.thresholds.amber) return 'd-amber';
  return '';
}

// head is rebuilt on language switch only (metric labels differ); ALL warehouse groups are
// always rendered (tagged with a wg{i} class) -- the System/Warehouse filter hides groups via
// a tiny injected <style> rule (updateWideColumnVisibility) instead of touching the DOM
// Three header rows: sub-group band (US / CA / AU ...) > warehouse > metrics.
// Unlike the body (which hides columns with a CSS rule), the head is REBUILT from the
// currently visible columns -- a band's colSpan can't be fixed up by display:none, so
// hiding one warehouse inside a band would otherwise leave the band too wide.
function renderWideHead(visibleIdx){
  const t = I18N[LANG];
  const idx = visibleIdx || HG.regions.find(r=>r.key===HG.default_region).idx;
  const thead = document.querySelector('#wideTable thead');
  thead.innerHTML = '';
  const tr0 = document.createElement('tr');
  const tr1 = document.createElement('tr');
  const tr2 = document.createElement('tr');
  t.hIdHeaders.forEach((h,i)=>{
    const th = document.createElement('th');
    th.textContent = h; th.rowSpan = 3; th.className = 'sticky sk'+i;
    tr0.appendChild(th);
  });
  // band cells: one per run of consecutive visible columns sharing a sub-group
  let bandStart = 0;
  const flushBand = (endExclusive)=>{
    if (endExclusive <= bandStart) return;
    const [region, sub] = HG.wh_region[idx[bandStart]];
    const th = document.createElement('th');
    th.textContent = (region === sub) ? region : `${region} · ${sub}`;
    th.colSpan = (endExclusive - bandStart) * t.hMetricLabels.length;
    th.className = 'wh-band';
    tr0.appendChild(th);
  };
  idx.forEach((gi, pos)=>{
    if (pos > 0){
      const prev = HG.wh_region[idx[pos-1]], cur = HG.wh_region[gi];
      if (prev[0] !== cur[0] || prev[1] !== cur[1]){ flushBand(pos); bandStart = pos; }
    }
    const th = document.createElement('th');
    th.textContent = HG.wh_headers[gi]; th.colSpan = t.hMetricLabels.length;
    th.className = (pos % 2 === 0 ? 'wh-group-a' : 'wh-group-b');
    tr1.appendChild(th);
    t.hMetricLabels.forEach(ml=>{
      const mth = document.createElement('th');
      mth.textContent = ml;
      tr2.appendChild(mth);
    });
  });
  flushBand(idx.length);
  thead.appendChild(tr0); thead.appendChild(tr1); thead.appendChild(tr2);
}

let wideTrList = [];   // data <tr> elements only (subtotal/total rows are tracked separately)
let hRowMeta = [];     // {sku, name, master, sub, hasIdx} per data row, for fast filtering
let hSubtotalTrs = []; // {tr, master} so an empty group can be hidden along with its 小计
let hGrandTr = null;   // the 总计 <tr>, recomputed on every filter change

// Build one warehouse block of <td>s. `flags` marks a substituted daily average.
function hCells(cells, gi, sku, meta, fallback, extraCls){
  const out = [];
  const block = cells[gi];
  if (block === null || block === undefined){
    for (let i=0;i<HG.metrics_zh.length;i++) out.push(`<td class="wg${gi}${extraCls} grey">-</td>`);
    return out.join('');
  }
  block.forEach((v,i)=>{
    const isDay = (i===2 || i===5);
    const cls = ['wg'+gi];
    if (extraCls) cls.push(extraCls.trim());
    if (isDay){ const dc = dayClass(v, block[1]); if (dc) cls.push(dc); }
    if (i===1 && fallback) cls.push('avg-fb');
    let inner;
    // ITI stays clickable: it still opens the shipment-level detail modal
    if (i===3 && typeof v === 'number' && v > 0 && sku){
      const [plat, wh] = meta;
      const key = [plat, wh, sku].join('|');
      inner = `<span class="iti-link" data-key="${escAttr(key)}" data-sys="${escAttr(plat)}" data-wh="${escAttr(wh)}" data-sku="${escAttr(sku)}" data-total="${v}">${hFmt(v,false)}</span>`;
    } else {
      inner = hFmt(v, isDay);
    }
    out.push(`<td class="${cls.join(' ')}">${inner}</td>`);
  });
  return out.join('');
}

function renderWideBody(){
  const t = I18N[LANG];
  const tbody = document.querySelector('#wideTable tbody');
  const html = [];
  const rowIndex = [];   // parallel to the data <tr>s that end up in the DOM
  const subIndex = [];   // {domRow, master}
  let domRow = 0;

  HG.groups.forEach(g=>{
    g.rows.forEach(r=>{
      html.push('<tr>');
      html.push(`<td class="sticky sk0">${esc(r.master)}</td>`);
      html.push(`<td class="sticky sk1">${esc(r.sub)}</td>`);
      html.push(`<td class="sticky sk2 name-cell">${esc(r.name)}</td>`);
      html.push(`<td class="sticky sk3">${esc(r.sku)}</td>`);
      HG.wh_meta.forEach((m, gi)=> html.push(hCells(r.cells, gi, r.sku, m, r.avg_fallback[gi], '')));
      html.push('</tr>');
      const hasIdx = new Set();
      r.cells.forEach((c,i)=>{ if (c !== null) hasIdx.add(i); });
      rowIndex.push({ sku:r.sku, name:r.name, master:r.master, sub:r.sub, hasIdx, domRow });
      domRow++;
    });
    // 小计
    html.push('<tr class="subtotal">');
    html.push(`<td class="sticky sk0">${esc(t.hSubtotal(g.master))}</td>`);
    html.push('<td class="sticky sk1"></td><td class="sticky sk2"></td><td class="sticky sk3"></td>');
    HG.wh_meta.forEach((m, gi)=> html.push(hCells(g.subtotal, gi, null, m, false, '')));
    html.push('</tr>');
    subIndex.push({ domRow, master: g.master });
    domRow++;
  });

  // 总计
  html.push('<tr class="grand">');
  html.push(`<td class="sticky sk0">${esc(t.hGrandTotal)}</td>`);
  html.push('<td class="sticky sk1"></td><td class="sticky sk2"></td><td class="sticky sk3"></td>');
  HG.wh_meta.forEach((m, gi)=> html.push(hCells(HG.total, gi, null, m, false, '')));
  html.push('</tr>');

  tbody.innerHTML = html.join('');
  const all = Array.from(tbody.children);
  wideTrList = rowIndex.map(x=>all[x.domRow]);
  hRowMeta = rowIndex;
  hSubtotalTrs = subIndex.map(x=>({ tr: all[x.domRow], master: x.master }));
  hGrandTr = all[all.length-1];
}

// hide/show whole warehouse-group columns via one injected <style> rule -- O(1) regardless of
// table size, since the browser's CSS engine does the work instead of JS touching every cell
function updateWideColumnVisibility(visibleIdx){
  const styleEl = document.getElementById('wideColStyle');
  const visibleSet = new Set(visibleIdx);
  const hidden = [];
  for (let i=0;i<HG.wh_meta.length;i++){ if (!visibleSet.has(i)) hidden.push(i); }
  styleEl.textContent = hidden.length ? hidden.map(i=>`.wg${i}{display:none}`).join('') : '';
}

// Recompute 小计/总计 from the rows that are actually visible. The precomputed figures in
// DATA.hgrid cover every SKU, which is right until a search narrows the table -- leaving a
// 总计 that silently disagrees with the rows above it. Mirrors the Python aggregation exactly:
// sum stock and daily averages, then derive both day columns from the sums.
function aggregate(rowList){
  const out = [];
  for (let ci=0; ci<HG.wh_meta.length; ci++){
    const present = rowList.map(r=>r.cells[ci]).filter(c=>c !== null && c !== undefined);
    if (!present.length){ out.push(null); continue; }
    let soh=0, iti=0, avg=null;
    present.forEach(c=>{
      soh += c[0] || 0;
      iti += c[3] || 0;
      if (c[1] !== null && c[1] !== undefined) avg = (avg || 0) + c[1];
    });
    if (avg !== null) avg = Math.round(avg * 100) / 100;
    const days = (stock)=>{
      if (avg === null || avg <= 0) return stock > 0 ? 'inf' : 0.0;
      return Math.round(stock / avg * 10) / 10;
    };
    out.push([soh, avg, days(soh), iti, soh + iti, days(soh + iti)]);
  }
  return out;
}

// true per warehouse column when ANY contributing row's 周度日均 was substituted from the
// 30-day average -- so a subtotal built mostly on fallback numbers still carries the marker
function aggregateFallback(rowList){
  return HG.wh_meta.map((_m, ci)=>
    rowList.some(r=>r.cells[ci] !== null && r.cells[ci] !== undefined && r.avg_fallback[ci]));
}

// rewrite the metric cells of one aggregate <tr> in place (the 4 sticky label cells stay)
function paintAggregateRow(tr, cells, fbFlags){
  const tds = tr.children;
  const NM = HG.metrics_zh.length;
  HG.wh_meta.forEach((m, gi)=>{
    const block = cells[gi];
    for (let i=0;i<NM;i++){
      const td = tds[4 + gi*NM + i];
      if (!td) continue;
      const isDay = (i===2 || i===5);
      const v = block ? block[i] : null;
      td.textContent = hFmt(v, isDay);
      let cn = 'wg'+gi;
      if (block === null || block === undefined) cn += ' grey';
      if (isDay){ const dc = dayClass(v, block ? block[1] : null); if (dc) cn += ' ' + dc; }
      if (i===1 && fbFlags && fbFlags[gi]) cn += ' avg-fb';
      td.className = cn;
    }
  });
}

let hFiltered = [];      // visible data rows, used by the Excel export
let hVisibleIdx = [];
function applyHorizontalFilter(){
  const q = document.getElementById('hSearch').value.trim().toLowerCase();
  const visibleIdx = getVisibleWhIndices();
  hVisibleIdx = visibleIdx;
  updateWideColumnVisibility(visibleIdx);
  renderWideHead(visibleIdx);
  let shown = 0;
  hFiltered = [];
  const liveMasters = new Set();
  const flatRows = [];
  HG.groups.forEach(g=> g.rows.forEach(r=> flatRows.push(r)));
  wideTrList.forEach((tr, idx)=>{
    const meta = hRowMeta[idx];
    let ok = true;
    if (q && (meta.sku+' '+meta.name+' '+meta.master+' '+meta.sub).toLowerCase().indexOf(q) < 0) ok = false;
    // a row with no record in ANY currently visible warehouse is just 6 dashes per column --
    // hide it so switching to EMEA doesn't leave a wall of empty US-only SKUs
    if (ok){
      let hasAny = false;
      for (const gi of visibleIdx){ if (meta.hasIdx.has(gi)){ hasAny = true; break; } }
      if (!hasAny) ok = false;
    }
    tr.style.display = ok ? '' : 'none';
    if (ok){ shown++; liveMasters.add(meta.master); hFiltered.push(flatRows[idx]); }
  });
  // drop the 小计 of a group that has no visible rows left, and recompute the ones that remain
  // so 小计/总计 always describe exactly the rows on screen
  const visibleSkus = new Set(hFiltered.map(r=>r.sku));
  hSubtotalTrs.forEach(s=>{
    const live = liveMasters.has(s.master);
    s.tr.style.display = live ? '' : 'none';
    if (!live) return;
    const grp = HG.groups.find(g=>g.master === s.master);
    const live_rows = grp.rows.filter(r=>visibleSkus.has(r.sku));
    paintAggregateRow(s.tr, aggregate(live_rows), aggregateFallback(live_rows));
  });
  if (hGrandTr) paintAggregateRow(hGrandTr, aggregate(hFiltered), aggregateFallback(hFiltered));
  applyStickyOffsets('wideTable', 4, 'sk');
  document.getElementById('hCount').textContent = I18N[LANG].hCount(shown, HG.n_rows);
}

function populateHorizontalSelects(){
  const t = I18N[LANG];
  const regSel = document.getElementById('hRegion');
  const cur = regSel.value || HG.default_region;
  regSel.innerHTML = '';
  HG.regions.forEach(r=>{
    const o = document.createElement('option');
    o.value = r.key; o.textContent = `${t.hRegionLabel}: ${r.label}`;
    regSel.appendChild(o);
  });
  regSel.value = HG.regions.some(r=>r.key===cur) ? cur : HG.regions[0].key;

  const region = HG.regions.find(r=>r.key===regSel.value);
  populateMultiSelectOptions('hWarehouse', region.idx.map(i=>HG.wh_meta[i][1]), 'hWarehouseAll');
}

function initHorizontalControls(){
  initMultiSelect('hWarehouse');
  document.getElementById('hRegion').value = HG.default_region;

// ---------------- excel export ----------------
function timestamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

// ---------------- Excel export (ExcelJS) ----------------
// Every exported cell is centred both ways, per Mili 2026-09-20. Long free-text columns
// (product name) stay left-aligned and wrapped, because centring a 40-character product
// name makes a column of them unreadable.
const XL_CENTER = { horizontal: 'center', vertical: 'middle', wrapText: true };
const XL_LEFT   = { horizontal: 'left',   vertical: 'middle', wrapText: true };
const XL_THIN   = { style: 'thin', color: { argb: 'FFD8DEE8' } };
const XL_BORDER = { top: XL_THIN, left: XL_THIN, bottom: XL_THIN, right: XL_THIN };

function xlDownload(wb, filename){
  wb.xlsx.writeBuffer().then(buf=>{
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }).catch(e=>{ console.error('xlsx export failed', e); alert('导出失败: ' + e.message); });
}

function exportVertical(){
  const t = I18N[LANG];
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Vertical', {views:[{state:'frozen', xSplit:0, ySplit:1}]});
  ws.addRow(t.vHeaders);
  vFiltered.forEach(r=> ws.addRow(r.map(v=> v===null ? '' : v)));
  const nameCol = t.vHeaders.indexOf(LANG==='zh' ? 'SKU名称' : 'SKU Name') + 1;
  ws.columns.forEach((col, i)=>{ col.width = (i+1 === nameCol) ? 38 : 15; });
  ws.eachRow((row, rn)=>{
    row.height = rn === 1 ? 28 : 18;
    row.eachCell({includeEmpty:true}, (cell, cn)=>{
      cell.alignment = (cn === nameCol) ? XL_LEFT : XL_CENTER;
      cell.border = XL_BORDER;
      if (rn === 1){
        cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1F4E78'} };
      }
    });
  });
  ws.autoFilter = { from:{row:1, column:1}, to:{row:1, column:t.vHeaders.length} };
  xlDownload(wb, `仓储数据看板_竖版_${timestamp()}.xlsx`);
}

// Excel export mirrors what is on screen, and (per Mili 2026-09-20) splits the selected
// region into multiple sheets: a 汇总 sheet covering every warehouse of the region, then one
// sheet per sub-group (Americas -> 汇总 / US / CA / AU, EMEA -> 汇总 / DE / UK / FR,
// APAC -> 汇总 / 嘀嗒 / 保宏 / 京东). Every sheet keeps the same row set, grouping and
// 小计/总计 logic; only the warehouse columns differ, and each sheet's aggregates are
// computed over just that sheet's columns.
function buildWideSheet(wb, sheetName, colIdx){
  const t = I18N[LANG];
  const nM = t.hMetricLabels.length;
  // Excel row number -> the data row that produced it, so the day-cover colouring can look
  // up that row's own 周度日均 (a 0.0 with no demand must NOT be painted red, same rule as
  // the screen). Aggregate rows are absent from this map and are skipped.
  const rowByExcelRow = new Map();
  // the ID headers go on the FIRST row: these 4 columns are merged across all three header
  // rows, and Excel renders a merged range using its top-left cell -- putting the labels on
  // the last row made A1:D3 come out blank.
  const band = [...t.hIdHeaders];
  const row1 = ['', '', '', ''];
  const row2 = ['', '', '', ''];
  colIdx.forEach(gi=>{
    const [region, sub] = HG.wh_region[gi];
    band.push(region === sub ? region : `${region} · ${sub}`);
    row1.push(HG.wh_headers[gi]);
    for (let i=1;i<nM;i++){ band.push(''); row1.push(''); }
    t.hMetricLabels.forEach(m=>row2.push(m));
  });
  const aoa = [band, row1, row2];
  const cell = (v)=> v === null || v === undefined ? '-' : (v === 'inf' ? '∞' : v);
  const visibleSkus = new Set(hFiltered.map(r=>r.sku));
  const pushBlocks = (arr, cells)=>{
    colIdx.forEach(gi=>{
      const b = cells[gi];
      if (b === null || b === undefined){ for (let i=0;i<nM;i++) arr.push('-'); }
      else b.forEach(v=>arr.push(cell(v)));
    });
  };
  let anyRows = false;
  HG.groups.forEach(g=>{
    const rows = g.rows.filter(r=>visibleSkus.has(r.sku));
    if (!rows.length) return;
    anyRows = true;
    rows.forEach(r=>{
      const row = [r.master, r.sub, r.name, r.sku];
      pushBlocks(row, r.cells);
      aoa.push(row);
      rowByExcelRow.set(aoa.length, r);   // aoa.length == this row's 1-based Excel row
    });
    // aggregate from the VISIBLE rows, exactly like the screen does. Using the precomputed
    // g.subtotal here would export whole-dataset figures underneath a searched-down row list.
    const sub = [t.hSubtotal(g.master), '', '', ''];
    pushBlocks(sub, aggregate(rows));
    aoa.push(sub);
  });
  // no rows matched -> don't append a grand total that nothing on the sheet adds up to
  if (anyRows){
    const tot = [t.hGrandTotal, '', '', ''];
    pushBlocks(tot, aggregate(hFiltered));
    aoa.push(tot);
  }

  // ---- render into an ExcelJS worksheet ----
  const ws = wb.addWorksheet(sheetName, {views:[{state:'frozen', xSplit:4, ySplit:3}]});
  aoa.forEach(r=> ws.addRow(r));

  // merges. ExcelJS is 1-based and takes (top, left, bottom, right).
  for (let c=1;c<=4;c++) ws.mergeCells(1, c, 3, c);            // ID columns span all 3 header rows
  colIdx.forEach((gi, pos)=>{                                   // warehouse label across its metrics
    ws.mergeCells(2, 5 + pos*nM, 2, 4 + (pos+1)*nM);
  });
  let start = 0;                                                // sub-group band
  for (let pos=1; pos<=colIdx.length; pos++){
    const prev = HG.wh_region[colIdx[pos-1]];
    const cur  = pos < colIdx.length ? HG.wh_region[colIdx[pos]] : null;
    if (!cur || cur[0] !== prev[0] || cur[1] !== prev[1]){
      ws.mergeCells(1, 5 + start*nM, 1, 4 + pos*nM);
      start = pos;
    }
  }

  ws.columns.forEach((col, i)=>{ col.width = i === 2 ? 40 : (i < 4 ? 20 : 13); });

  const fill = (argb)=>({ type:'pattern', pattern:'solid', fgColor:{argb} });
  ws.eachRow({includeEmpty:true}, (row, rn)=>{
    row.height = rn <= 3 ? 24 : 18;
    const label = String(row.getCell(1).value || '');
    const isSub = label.indexOf(t.hSubtotal('')) >= 0 || label === t.hGrandTotal
                  || label.endsWith('小计') || label.endsWith('Subtotal');
    const isTot = label === t.hGrandTotal;
    row.eachCell({includeEmpty:true}, (cell, cn)=>{
      // column 3 is 产品名称 -- free text, left-aligned so a column of long names stays readable
      cell.alignment = (cn === 3 && rn > 3) ? XL_LEFT : XL_CENTER;
      cell.border = XL_BORDER;
      if (rn === 1){ cell.font = {bold:true, color:{argb:'FFFFFFFF'}}; cell.fill = fill('FF1F3A8A'); }
      else if (rn === 2){ cell.font = {bold:true, color:{argb:'FF1D4ED8'}}; cell.fill = fill('FFEEF3FF'); }
      else if (rn === 3){ cell.font = {bold:true, color:{argb:'FF334155'}}; cell.fill = fill('FFF1F5F9'); }
      else if (isTot){ cell.font = {bold:true}; cell.fill = fill('FFE2E8F0'); }
      else if (isSub){ cell.font = {bold:true}; cell.fill = fill('FFF1F5F9'); }
      // carry the on-screen day-cover colouring into the file
      if (rn > 3 && cn > 4){
        const within = (cn - 5) % nM;
        if (within === 2 || within === 5){
          const gi = colIdx[Math.floor((cn - 5) / nM)];
          const src = isSub ? null : rowByExcelRow.get(rn);
          const blk = src ? src.cells[gi] : null;
          const v = cell.value;
          if (typeof v === 'number' && blk && blk[1] > 0){
            if (v < HG.thresholds.red){ cell.fill = fill('FFFEE2E2'); cell.font = {bold:true, color:{argb:'FFB91C1C'}}; }
            else if (v < HG.thresholds.amber){ cell.fill = fill('FFFEF3C7'); cell.font = {bold:true, color:{argb:'FFB45309'}}; }
          }
        }
      }
    });
  });
  return ws;
}

// Excel sheet names: <=31 chars and none of : \ / ? * [ ]
function safeSheetName(name, used){
  let base = String(name).replace(/[:\\\/?*\[\]]/g, '-').slice(0, 31) || 'Sheet';
  let n = base, i = 2;
  while (used.has(n)){ n = base.slice(0, 28) + '_' + (i++); }
  used.add(n);
  return n;
}

function exportWide(){
  // the search box is debounced 200ms; exporting inside that window would ship the
  // PREVIOUS row set. Force the filter to settle first.
  applyHorizontalFilter();
  const regionKey = document.getElementById('hRegion').value;
  const region = HG.regions.find(r=>r.key === regionKey) || HG.regions[HG.regions.length-1];
  // respect the warehouse multi-select on top of the region
  const visible = new Set(hVisibleIdx);
  const wb = new ExcelJS.Workbook();
  const used = new Set();
  // '全部 (All)' has a space and brackets that make an ugly filename / illegal sheet name
  const rname = region.key === 'ALL' ? '全部' : region.label;

  // sheet 1: the whole region
  buildWideSheet(wb, safeSheetName(`${rname}汇总`, used), hVisibleIdx);
  // then one sheet per sub-group that still has visible columns
  (region.subgroups || []).forEach(sg=>{
    const idx = sg.idx.filter(i=>visible.has(i));
    if (!idx.length) return;
    buildWideSheet(wb, safeSheetName(sg.label, used), idx);
  });

  xlDownload(wb, `仓储数据看板_横版_${rname}_${timestamp()}.xlsx`);
}

document.getElementById('vExport').addEventListener('click', exportVertical);
document.getElementById('hExport').addEventListener('click', exportWide);
document.getElementById('navFootnoteJump').addEventListener('click', ()=>{
  const el = document.getElementById('footnotes');
  if (el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
});

function renderFootnotes(){
  const t = I18N[LANG];
  const el = document.getElementById('footnotes');
  el.innerHTML = `<div class="ft-title">${t.footTitle}</div>` + t.footnotes.join('<br><br>');
}

// ---------------- 周会汇报 / Weekly Review tab ----------------
// Distinct warehouses derived from REGION_MAP, keyed by region: { Americas: ['USKY3(...)', ...], ... }
const REGION_WAREHOUSES = (()=>{
  const map = {};
  Object.keys(REGION_MAP).forEach(k=>{
    const wh = k.split('|')[1];
    const region = REGION_MAP[k];
    if (!map[region]) map[region] = new Set();
    map[region].add(wh);
  });
  const out = {};
  Object.keys(map).forEach(region=>{ out[region] = Array.from(map[region]).sort(); });
  return out;
})();

function selectedMeetingRegion(){
  const sel = document.getElementById('meetingRegion');
  return sel ? sel.value : '';
}
function selectedMeetingWarehouse(){
  const sel = document.getElementById('meetingWarehouse');
  return sel ? sel.value : '';
}
function populateMeetingRegionSelect(){
  const t = I18N[LANG];
  const sel = document.getElementById('meetingRegion');
  const cur = sel.value;
  sel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value = ''; o0.textContent = t.regionFilterAll; sel.appendChild(o0);
  REGION_ORDER.forEach(region=>{
    const o = document.createElement('option'); o.value = region; o.textContent = t.regionLabels[region]; sel.appendChild(o);
  });
  sel.value = REGION_ORDER.includes(cur) ? cur : '';
}
function populateMeetingWarehouseSelect(){
  const t = I18N[LANG];
  const sel = document.getElementById('meetingWarehouse');
  const cur = sel.value;
  const region = selectedMeetingRegion();
  const regions = region ? [region] : REGION_ORDER;
  const whs = [];
  regions.forEach(r => (REGION_WAREHOUSES[r] || []).forEach(w => { if (!whs.includes(w)) whs.push(w); }));
  whs.sort();
  sel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value = ''; o0.textContent = t.meetingWarehouseAll; sel.appendChild(o0);
  whs.forEach(wh=>{
    const o = document.createElement('option'); o.value = wh; o.textContent = wh; sel.appendChild(o);
  });
  sel.value = whs.includes(cur) ? cur : '';
}

function renderRegionBars(){
  const t = I18N[LANG];
  const el = document.getElementById('regionBars');
  const selected = selectedMeetingRegion();
  const selectedWh = selectedMeetingWarehouse();
  const regions = selected ? [selected] : REGION_ORDER;
  const html = [];
  regions.forEach(region=>{
    // 不补货 gets its OWN counter rather than falling into the `na` bucket: the Python side
    // excludes it from na_count too, and lumping the two together would (a) make the KPI card
    // and this bar disagree by exactly the number of parked rows, and (b) conflate "parked on
    // purpose" with "no sales rate to judge by".
    let alert = 0, normal = 0, na = 0, norestock = 0;
    DATA.vrows.forEach(r=>{
      if (regionOf(r[0], r[1]) !== region) return;
      if (selectedWh && r[1] !== selectedWh) return;
      const code = alertCode(r[18]);
      if (code === 'ALERT') alert++;
      else if (code === 'Normal') normal++;
      else if (code === 'NoRestock') norestock++;
      else na++;
    });
    const total = alert + normal + na + norestock;
    const pct = n => total ? (n / total * 100) : 0;
    html.push(`<div class="region-bar-row">
      <div class="region-bar-label">${esc(t.regionLabels[region])}</div>
      <div class="region-bar-track">
        <div class="region-bar-seg alert" style="width:${pct(alert)}%"></div>
        <div class="region-bar-seg normal" style="width:${pct(normal)}%"></div>
        <div class="region-bar-seg na" style="width:${pct(na)}%"></div>
        <div class="region-bar-seg norestock" style="width:${pct(norestock)}%"></div>
      </div>
      <div class="region-bar-counts">🔴 ${alert} &nbsp; 🟢 ${normal} &nbsp; – ${na}${norestock ? ' &nbsp; ⚪ ' + norestock : ''} &nbsp;·&nbsp; ${esc(t.regionTotal(total))}</div>
    </div>`);
  });
  el.innerHTML = html.join('');
}

// Monthly Avg/Day = vrows[9], Weekly Avg/Day = vrows[10], History Sales Daily = vrows[11]
function fcAvgCell(r){
  const m = r[9], w = r[10];
  const mOk = typeof m === 'number', wOk = typeof w === 'number';
  if (!mOk && !wOk) return '--';
  return `${mOk ? m : '-'} / ${wOk ? w : '-'}`;
}

const N_STICKY_RISK = 4;  // System / 仓库 / 易仓SKU / SKU名称
function renderRiskLists(){
  const t = I18N[LANG];
  const el = document.getElementById('riskLists');
  const selected = selectedMeetingRegion();
  const selectedWh = selectedMeetingWarehouse();
  const regions = selected ? [selected] : REGION_ORDER;
  const html = [];
  const renderedTableIds = [];
  regions.forEach(region=>{
    const rows = DATA.vrows.filter(r => regionOf(r[0], r[1]) === region && (!selectedWh || r[1] === selectedWh) && alertCode(r[18]) === 'ALERT');
    rows.sort((a, b) => a[15] - b[15]);
    html.push(`<div class="risk-region"><div class="risk-region-title">${esc(t.regionLabels[region])} · ${esc(t.riskCount(rows.length))}</div>`);
    if (!rows.length){
      html.push(`<div class="risk-empty">${esc(t.riskEmpty)}</div>`);
    } else {
      const tableId = 'riskTable_' + region;
      renderedTableIds.push(tableId);
      html.push(`<div class="table-wrap"><table class="risk-table" id="${tableId}"><thead><tr>` +
        t.riskHeaders.map((h, i) => `<th${i < N_STICKY_RISK ? ` class="sticky rk${i}"` : ''}>${esc(h)}</th>`).join('') +
        '</tr></thead><tbody>');
      rows.forEach(r=>{
        const hist = r[11], soh = r[12], iti = r[13], doc = r[15], eta = r[14];
        let itiCell = esc(iti);
        if (typeof iti === 'number' && iti > 0){
          const key = [r[0], r[1], r[3]].join('|');
          itiCell = `<span class="iti-link" data-key="${esc(key)}" data-sys="${esc(r[0])}" data-wh="${esc(r[1])}" data-sku="${esc(r[3])}" data-total="${iti}">${iti}</span>`;
        }
        const badge = alertBadgeHtml(r[18]);
        html.push(`<tr><td class="sticky rk0">${esc(r[0])}</td><td class="sticky rk1">${esc(r[1])}</td>` +
          `<td class="sticky rk2">${esc(r[3])}</td><td class="sticky rk3 name-cell">${esc(r[4])}</td>` +
          `<td>${esc(fcAvgCell(r))}</td><td>${esc(hist)}</td>` +
          `<td>${esc(soh)}</td><td>${itiCell}</td>` +
          `<td><b>${esc(doc)}</b></td><td>${esc(eta) || '--'}</td><td>${badge || esc(r[18])}</td></tr>`);
      });
      html.push('</tbody></table></div>');
    }
    html.push('</div>');
  });
  el.innerHTML = html.join('');
  renderedTableIds.forEach(id => applyStickyOffsets(id, N_STICKY_RISK, 'rk'));
}

function renderMeeting(){
  populateMeetingRegionSelect();
  populateMeetingWarehouseSelect();
  renderRegionBars();
  renderRiskLists();
}

function initMeetingControls(){
  document.getElementById('meetingRegion').addEventListener('change', ()=>{
    populateMeetingWarehouseSelect();
    renderRegionBars();
    renderRiskLists();
  });
  document.getElementById('meetingWarehouse').addEventListener('change', ()=>{
    renderRegionBars();
    renderRiskLists();
  });
}

function applyStaticI18n(){
  const t = I18N[LANG];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.getAttribute('data-i18n-ph');
    if (t[key] !== undefined) el.placeholder = t[key];
  });
}

function setLang(lang){
  LANG = lang;
  document.getElementById('btnZh').classList.toggle('active', lang==='zh');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  applyStaticI18n();
  populateVerticalSelects();
  renderVerticalHead();
  applyVerticalFilters();
  populateHorizontalSelects();
  // the 小计/总计 label cells are baked in by renderWideBody and are NOT touched by
  // paintAggregateRow, so the body has to be rebuilt for them to follow the language
  renderWideBody();
  applyHorizontalFilter();
  renderMeeting();
  renderFootnotes();
}

document.getElementById('btnZh').addEventListener('click', ()=>setLang('zh'));
document.getElementById('btnEn').addEventListener('click', ()=>setLang('en'));

document.querySelectorAll('.nav-item').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const which = t.dataset.tab;
    document.getElementById('panel-vertical').style.display = which==='vertical' ? '' : 'none';
    document.getElementById('panel-horizontal').style.display = which==='horizontal' ? '' : 'none';
    // sticky column offsets are measured from getBoundingClientRect(); the first pass runs
    // while this panel is display:none, so every width reads 0 and all four ID columns
    // stack at left:0. Re-measure once the panel is actually on screen.
    if (which==='horizontal') applyStickyOffsets('wideTable', 4, 'sk');
    document.getElementById('panel-meeting').style.display = which==='meeting' ? '' : 'none';
  });
});

renderVerticalBody();
renderWideBody();
initVerticalControls();
initHorizontalControls();
initMeetingControls();
setLang('zh');
</script>
